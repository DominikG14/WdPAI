version: '3'

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
      - "${APP_HTTPS_PORT:-8443}:443"
    volumes:
      - .:/app/
    links:
      - php
    networks:
      - pg-network
  
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-docker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-docker}
      POSTGRES_DB: ${DB_NAME:-db}
    networks:
      - pg-network
    volumes:
      - ./docker/db/init:/docker-entrypoint-initdb.d
  
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      DB_USERNAME: ${DB_USERNAME:-docker}
      DB_PASSWORD: ${DB_PASSWORD:-docker}
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-db}
    volumes:
      - .:/app
    networks:
      - pg-network
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pg-admin2
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - pg-network
  
networks:
  pg-network:

volumes:
  pg-data:
