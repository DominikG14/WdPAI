                        <td><?= $user->getId(); ?></td>
                        <td><strong><?= htmlspecialchars($user->getUsername()); ?></strong></td>
                        <td><?= htmlspecialchars($user->getEmail()); ?></td>
                        <td>
                            <a href="/admin/users/progress/<?= $user->getId(); ?>" class="btn-progress">

                            </a>

                            <?php else: ?>

                                </a>

    <script>
        $(document).ready(function() {
            const currentUserId = <?= json_encode($_SESSION['user_id']); ?>;

            $('#search-input').on('input', function() {
                const searchValue = $(this).val();

                $.ajax({
                    url: '/admin/users/search',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ search: searchValue }),
                    dataType: 'json',
                    success: function(users) {
                        const $tableBody = $('#users-table-body');
                        $tableBody.empty(); // Czyszczenie starych wierszy tabeli

                        if (users.length === 0) {
                            $tableBody.append('<tr><td colspan="4" style="text-align:center; color: #666; font-style: italic;">Nie znaleziono dopasowań.</td></tr>');
                            return;
                        }

                        // Renderowanie nowych wierszy z danych JSON
                        users.forEach(function(user) {
                            let actionButton = '';
                            
                            if (parseInt(user.id) === parseInt(currentUserId)) {
                                actionButton = '<span class="badge-self">To Ty</span>';
                            } else {
                                actionButton = `
                                    <a href="/admin/users/delete/${user.id}" 
                                       class="btn-delete" 
                                       onclick="return confirm('Czy na pewno chcesz usunąć tego użytkownika?')">
                                       <i class="fa-solid fa-trash"></i> Usuń konto
                                    </a>
                                `;
                            }

                            // Filtrowanie przed atakami XSS
                            const safeUsername = $('<div>').text(user.username).html();
                            const safeEmail = $('<div>').text(user.email).html();

                            const row = `
                                <tr>
                                    <td>${user.id}</td>
                                    <td><strong>${safeUsername}</strong></td>
                                    <td>${safeEmail}</td>
                                    <td>
                                        <a href="/admin/users/progress/${user.id}" class="btn-progress">
                                            <i class="fa-solid fa-eye"></i> Postępy
                                        </a>
                                        ${actionButton}
                                    </td>
                                </tr>
                            `;
                            $tableBody.append(row);
                        });
                    },
                    error: function(xhr, status, error) {
                        console.error("Błąd AJAX: ", error);
                        console.error("Status kodu: ", xhr.status);
                    }
                });
            });
        });
    </script>
