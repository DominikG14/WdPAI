<!DOCTYPE html>
<html lang="en">
<head>
    <?php include __DIR__ . '/partials/head.html'; ?>
    <title>Logowanie</title>
</head>
<body>
    <?php include __DIR__ . '/partials/nav.html'; ?>
    
    <div class="container">
        <form method="POST" action="/login">
            <h1>LOGIN</h1>

            <?php if(isset($messages)): ?>
                <div class="messages">
                    <?php foreach($messages as $message): ?>
                        <p><?= $message; ?></p>
                    <?php endforeach; ?>
                </div>
            <?php endif; ?>

            <input name="email" type="email" placeholder="Twój email" required />
            <input name="password" type="password" placeholder="Twoje hasło" required />
            
            <input type="hidden" name="returnUrl" id="returnUrl" value="" />
            
            <button type="submit">LOGIN</button>

            <div class="form-footer">
                <a href="/register">Nie masz konta? Zarejestruj się!</a>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const returnUrl = params.get('returnUrl');
            if (returnUrl) {
                document.getElementById('returnUrl').value = returnUrl;
            }
        });
    </script>
</body>
</html>
