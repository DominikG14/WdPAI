        </div>
    </main>

    <script>
        let currentIdx = 0;
        const cards = document.querySelectorAll('.exercise-card');
        const totalCount = cards.length;

        // Aktualizacja paska postępu na starcie
        updateProgress();

        function handleAnswerClick(button, val) {
            // 1. Zapisz odpowiedź w atrybucie karty zadania
            const currentCard = cards[currentIdx];
            currentCard.setAttribute('data-user-answer', val);

            // Wizualny efekt kliknięcia przed zmianą pytania (krótkie podświetlenie)
            button.style.background = "#0056b3";
            button.style.color = "white";

            // 2. Opóźnienie rzędu 200ms, aby użytkownik zarejestrował kliknięcie, a następnie automatyczna zmiana pytania
            setTimeout(() => {
                currentCard.classList.remove('active');
                currentIdx++;

                if (currentIdx >= totalCount) {
                    checkQuiz();
                } else {
                    cards[currentIdx].classList.add('active');
                    updateProgress();
                }
            }, 200);
        }

        function updateProgress() {
            const progressText = document.getElementById('quiz-progress');
            if (progressText && totalCount > 0) {
                progressText.innerText = `Zadanie ${currentIdx + 1} z ${totalCount}`;
            }
        }

        function checkQuiz() {
            let correctCount = 0;

            cards.forEach(card => {
                const correctAnswer = card.getAttribute('data-correct');
                const userAnswer = card.getAttribute('data-user-answer');

                if (userAnswer && userAnswer.toUpperCase() === correctAnswer.toUpperCase()) {
                    correctCount++;
                }
            });

            // Ukrycie interfejsu quizu i paska postępu
            document.getElementById('quiz-section').style.display = 'none';

            // Uzyskanie i wyświetlenie podsumowania punktacji
            document.getElementById('score-rating').innerText = `${correctCount} / ${totalCount}`;
            
            const percentage = (correctCount / totalCount) * 100;
            const feedback = document.getElementById('feedback-text');
            if (percentage === 100) {
                feedback.innerText = "Perfekcyjnie! Jesteś w pełni gotowy na maturę! 🎯";
            } else if (percentage >= 50) {
                feedback.innerText = "Dobry wynik! Masz już solidne podstawy, pracuj dalej! 👍";
            } else {
                feedback.innerText = "Musisz jeszcze trochę poćwiczyć ten dział. Nie poddawaj się! 💪";
            }

            document.getElementById('summary-section').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
